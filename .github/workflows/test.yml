name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Each step's exit status is the gate. Nothing here may be swallowed:
      # `go vet` and `go test` report package-level SETUP failures (a bad
      # import path, a dependency missing from go.mod) the same way they
      # report assertion failures, and a non-compiling test package is
      # exactly the state this workflow exists to catch.
      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
